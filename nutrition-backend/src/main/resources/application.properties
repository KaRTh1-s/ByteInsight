spring.application.name=nutrition

server.port=${PORT:8080}

# Datasource configuration with environment variable support
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/nutritiondb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.open-in-view=false

# Nutrition API configuration (support both NUTRITION_API_KEY and CALORIENINJAS_API_KEY)
nutrition.ninja.api.key=${NUTRITION_API_KEY:${CALORIENINJAS_API_KEY:}}
usda.api.key=${USDA_API_KEY:}

# JWT Security configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# CORS configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
