spring.application.name=nutrition-test

# Safe, isolated in-memory H2 database for automated tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Test JPA settings
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Test-specific dummy JWT secret (strictly for unit tests to ensure mvn test passes hermetically)
jwt.secret=ByteInsightTestSecretKeyForAutomatedTestsOnlyMustBe256BitsLong2026!
jwt.expiration=86400000

# Nutrition APIs disabled in unit tests
nutrition.ninja.api.key=
usda.api.key=

cors.allowed-origins=http://localhost:3000
